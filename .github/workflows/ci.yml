name: CI
on: [push]
permissions:
  contents: read
  checks: write
jobs:
  lhci:
    name: Lighthouse (budget perf >= 0.85 mobile on /, /collections/dogs, cooling-mat PDP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lighthouse
        uses: shopify/lighthouse-ci-action@v1
        with:
          store: ${{ secrets.SHOP_STORE }}
          access_token: ${{ secrets.SHOP_ACCESS_TOKEN }}  # Theme Access app password (shptka_), NOT the Admin shpat_
          collection_handle: dogs
          product_handle: washable-dog-cooling-mat-ice-silk-cooling-mat-for-dogs-pet-self-cooling-pad-blanket-dog-cool-pad-for-indoor-outdoor-car-seats-blue-40x28-in
          lhci_min_score_performance: 0.85
          lhci_github_app_token: ${{ secrets.LHCI_GITHUB_TOKEN }}
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}
